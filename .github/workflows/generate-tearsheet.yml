name: Generate Tearsheet at Market Close

on:
  schedule:
    # GitHub Actions cron uses UTC
    # NIFTY Close: 15:30 IST = 10:00 UTC (Mon-Fri)
    - cron: '0 10 * * 1-5'
    # MCX Close: 23:30 IST = 18:00 UTC (Mon-Fri)
    - cron: '0 18 * * 1-5'
    # NYMEX/Forex/World Close: ~17:00 EST = 22:00 UTC (Mon-Fri)
    - cron: '0 22 * * 1-5'
    # Crypto Daily Close: 00:00 UTC (Every day)
    - cron: '0 0 * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-tearsheet:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: 'thelioncapitaladvisors-create/TLCS_Website'
          path: 'TLCS_Website_Deploy'
          token: ${{ secrets.GH_PAT }}
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          echo "--- requirements.txt as checked out ---"
          cat algo_engine/requirements.txt
          pip install -r algo_engine/requirements.txt
          echo "--- installed versions ---"
          python -m pip show httpx gotrue supabase | grep -E "^(Name|Version):"
          python -c "import httpx, inspect; print('httpx.Client accepts proxy:', 'proxy' in inspect.signature(httpx.Client.__init__).parameters)"
          
      - name: Generate Tearsheet
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd algo_engine
          python backtest_edge.py
          
      - name: Commit and push changes to Website Repo
        run: |
          cd TLCS_Website_Deploy
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy_tearsheet.html
          git commit -m "Auto-generate strategy tearsheet [skip ci]" || echo "No changes to commit"
          git push
